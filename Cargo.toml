[package]
name = "c2_toolkit"
version = "0.1.0"
edition = "2021"

# Default binary (all modules)
[[bin]]
name = "c2_toolkit"
path = "src/main.rs"

# Server-only binary
[[bin]]
name = "server"
path = "src/bin/server.rs"

# Client/Agent binary
[[bin]]
name = "client"
path = "src/bin/client.rs"

[lib]
name = "c2_toolkit"
path = "src/lib.rs"

# Windows-only dependencies for most modules
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
    "winuser", "processthreadsapi", "memoryapi", "handleapi",
    "synchapi", "tlhelp32", "winsvc", "errhandlingapi",
    "securitybaseapi", "winnt", "libloaderapi", "fileapi",
    "ioapiset", "wincrypt", "winbase", "psapi", "shellapi",
    "minwindef", "ntdef", "ntsecapi", "impl-default",
    "dpapi"
]}
windows-sys = { version = "0.52", features = [
    "Win32_Foundation", "Win32_System_Threading",
    "Win32_Security", "Win32_System_Memory",
    "Win32_System_Diagnostics_Debug"
]}

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
md5 = "0.7"
sha2 = "0.10"
aes-gcm = "0.10"
base64 = "0.22"
regex = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
zip = "0.6"
walkdir = "2"
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
bytes = "1"
log = "0.4"
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
screenshots = "0.8"
lazy_static = "1.4"
hex = "0.4"
hostname = "0.4"
whoami = "1.5"
ctrlc = "3.4"
